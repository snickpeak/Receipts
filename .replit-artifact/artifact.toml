kind = "mobile"
previewPath = "/"
title = "Receipts"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/mobile", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/mobile", "run", "serve"]

[services.production.run.env]
PORT = "18115"
NODE_ENV = "production"

[services.env]
PORT = "18115"
BASE_PATH = "/"
